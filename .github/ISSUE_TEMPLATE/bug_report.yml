name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug. Please check existing issues first.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you see, and what did you expect to see instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Sign in as `demo`
        2. Open a movie and pick a showtime
        3. ...
    validations:
      required: true
  - type: dropdown
    id: role
    attributes:
      label: Which account type?
      options: [Customer, Employee, Admin, Not signed in]
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v1.0.0 or a commit SHA
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Output from `docker compose logs app`, browser console errors, or screenshots.
      render: shell
