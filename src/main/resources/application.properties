# Database configuration loaded from environment variables (see .env.example)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA/Hibernate settings
spring.jpa.hibernate.ddl-auto=update
# Keep Hibernate's own naming so column names match the existing schema (e.g. releasedate, not release_date)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.transaction.default-timeout=30

# Server settings
server.port=8080

# Pebble (templates/*.peb). Exposes request attributes such as the _csrf token to templates.
pebble.exposeRequestAttributes=true

# Stripe Configuration (test keys from https://dashboard.stripe.com/test/apikeys)
stripe.public.key=${STRIPE_PUBLIC_KEY:}
stripe.secret.key=${STRIPE_SECRET_KEY:}
